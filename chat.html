<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalCare — Chat with a Doctor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #0f0f18;
      --sidebar-bg: #0c0c14;
      --card: rgba(255, 255, 255, 0.035);
      --card-hover: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.06);
      --primary: #E63946;
      --primary-dim: rgba(230, 57, 70, 0.12);
      --primary-glow: rgba(230, 57, 70, 0.25);
      --accent: #48cae4;
      --text: #f0f0f5;
      --text-secondary: #8888a4;
      --text-muted: #4a4a5e;
      --radius: 12px;
      --sidebar-w: 280px;
      --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      line-height: 1.2;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    input, textarea { font-family: inherit; outline: none; border: none; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), opacity var(--transition);
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }

    .sidebar-header .logo span { color: var(--text); }

    .sidebar-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sidebar-close:hover { color: var(--text); background: var(--card); }

    .sidebar-new-btn {
      margin: 12px 16px;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      background: var(--primary-dim);
      color: var(--primary);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-new-btn:hover {
      background: rgba(230, 57, 70, 0.2);
      border-color: var(--primary);
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 16px 16px 8px;
    }

    .doctor-list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .doctor-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s;
      width: 100%;
    }

    .doctor-btn:hover { background: var(--card); color: var(--text); }

    .doctor-btn.active {
      background: var(--primary-dim);
      color: var(--text);
      border: 1px solid rgba(230,57,70,0.15);
    }

    .doctor-btn .d-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--card);
    }

    .doctor-btn .d-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .doctor-btn .d-avatar .d-emoji {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .doctor-btn .d-info { flex: 1; min-width: 0; }

    .doctor-btn .d-name {
      font-weight: 600;
      font-size: 13px;
    }

    .doctor-btn .d-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 13px;
      color: var(--text-secondary);
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      font-family: inherit;
    }

    .history-item:hover { background: var(--card); color: var(--text); }

    .history-item .h-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item .h-del {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      line-height: 1;
    }

    .history-item .h-del:hover { color: var(--primary); background: var(--primary-dim); }

    .history-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .history-empty span { font-size: 28px; display: block; margin-bottom: 8px; }

    /* ── Main Chat Area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 60px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(12px);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sidebar-toggle:hover { color: var(--text); background: var(--card); }

    .chat-header-info h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .chat-header-info p {
      font-size: 12px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-header-info p::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .header-btn:hover { color: var(--text); background: var(--card); }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }

    .messages {
      width: 100%;
      max-width: 740px;
      padding: 24px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .empty-state .empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--primary-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      border: 1px solid rgba(230,57,70,0.1);
    }

    .empty-state h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 360px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.65;
      word-wrap: break-word;
    }

    .msg.user .msg-bubble {
      background: var(--primary-dim);
      border: 1px solid rgba(230,57,70,0.15);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.assistant.doc-female .msg-bubble {
      border-left: 3px solid var(--primary);
    }

    .msg.assistant.doc-male .msg-bubble {
      border-left: 3px solid #3a4a6b;
    }

    .msg-image {
      margin-top: 6px;
      border-radius: 8px;
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Typing ── */
    .typing {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      align-self: flex-start;
      animation: msgIn 0.2s ease forwards;
    }

    .typing .msg-bubble {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--primary);
      border-bottom-left-radius: 4px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Error ── */
    .error-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(230, 57, 70, 0.95);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      animation: msgIn 0.3s ease;
      z-index: 1000;
      max-width: 500px;
      text-align: center;
    }

    /* ── Input ── */
    .input-area {
      padding: 16px 24px 20px;
      flex-shrink: 0;
      border-top: 1px solid var(--card-border);
      background: var(--bg);
    }

    .input-inner {
      max-width: 740px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 8px;
      transition: border-color 0.2s;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .input-inner:focus-within {
      border-color: rgba(230, 57, 70, 0.4);
    }

    .input-inner textarea {
      flex: 1;
      background: none;
      border: none;
      padding: 6px 8px;
      font-size: 15px;
      color: var(--text);
      resize: none;
      max-height: 200px;
      line-height: 1.5;
      font-family: inherit;
    }

    .input-inner textarea::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .input-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 18px;
    }

    .input-btn:hover { color: var(--text); background: var(--card); }

    .input-btn.send {
      background: var(--primary);
      color: #fff;
    }

    .input-btn.send:hover {
      background: #c1121f;
      box-shadow: 0 0 20px rgba(230,57,70,0.3);
    }

    .input-btn.send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── Image preview ── */
    .img-preview {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 24px 8px;
      flex-shrink: 0;
    }

    .img-preview.visible { display: flex; }

    .img-preview-inner {
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .img-preview img {
      height: 48px;
      width: 48px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--card-border);
    }

    .img-preview .img-name {
      font-size: 12px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .img-preview .img-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .img-preview .img-remove:hover { color: var(--primary); background: var(--primary-dim); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 200;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
      }

      .sidebar.open { transform: translateX(0); }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 199;
      }

      .sidebar-overlay.open { display: block; }

      .chat-header { padding: 0 16px; }
      .messages { padding: 16px 16px 8px; }
      .input-area { padding: 12px 16px 16px; }

      .msg { max-width: 95%; }
    }

    @media (max-width: 480px) {
      .chat-header-info h3 { font-size: 14px; }
      .msg-bubble { font-size: 14px; padding: 10px 14px; }
      .msg { max-width: 98%; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
      .typing { animation: none; }
      .typing-dot { animation: none; opacity: 0.5; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><span>Vital</span>Care</div>
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>
    <button class="sidebar-new-btn" id="new-chat-btn">✏️ New Chat</button>
    <div class="sidebar-section-title">Doctors</div>
    <div class="doctor-list" id="doctor-list"></div>
    <div class="sidebar-section-title">History</div>
    <div class="sidebar-history" id="history-list"></div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ═══ MAIN ═══ -->
  <main class="main">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
        <div class="chat-header-info">
          <h3 id="chat-title">Dr. Elena</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="chat-header-right">
        <button class="header-btn" id="delete-chat" title="Clear chat">🗑️</button>
      </div>
    </div>

    <div class="messages-wrap">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">💬</div>
          <h2>How can I help you?</h2>
          <p>Describe your symptoms or ask a health-related question. Your AI doctor is ready to assist.</p>
        </div>
      </div>
    </div>

    <div class="img-preview" id="img-preview">
      <div class="img-preview-inner">
        <img id="img-thumb" alt="Preview">
        <span class="img-name" id="img-name"></span>
        <button class="img-remove" id="img-remove">✕</button>
      </div>
    </div>

    <div class="input-area">
      <div class="input-inner">
        <textarea id="msg-input" rows="1" placeholder="Describe your symptoms..." autocomplete="off"></textarea>
        <div class="input-actions">
          <button class="input-btn" id="img-btn" title="Attach image">📷</button>
          <button class="input-btn send" id="send-btn" title="Send">↑</button>
        </div>
      </div>
    </div>

    <input type="file" id="img-input" accept="image/*" hidden>
  </main>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    apiKey: '',
    backendUrl: '',
    avatars: {}
  };

  var DOCTORS = {
    female: {
      name: 'Dr. Elena',
      label: 'Caring & Warm',
      emoji: '\uD83D\uDC69\u200D\u2695\uFE0F',
      key: 'female',
      prompt: 'You are Dr. Elena, a warm and caring doctor. Speak with kindness, empathy, and a gentle bedside manner — like a trusted family physician who truly listens. If the user asks something off-topic (not health-related), gently steer them back with warmth. For example: "That\'s an interesting question! While I\'m here to help with health topics, is there something about your wellbeing I can assist with? \uD83D\uDE0A" Always include: "This is for reference only, not medical advice. In emergencies, contact your doctor or emergency services." Never diagnose or prescribe.'
    },
    male: {
      name: 'Dr. James',
      label: 'Professional & Direct',
      emoji: '\uD83D\uDC68\u200D\u2695\uFE0F',
      key: 'male',
      prompt: 'You are Dr. James, a cold and strictly professional doctor. Be direct, concise, and clinical. No pleasantries, no warmth — just precise medical answers. If the user asks something off-topic, state flatly: "That is outside my scope. Please ask a health-related question." Always include: "This is for reference only, not medical advice. In emergencies, contact your doctor or emergency services." Never diagnose or prescribe.'
    }
  };

  var state = {
    selectedDoctor: 'female',
    messages: [],
    isLoading: false,
    conversations: [],
    pendingImage: null
  };

  // ── DOM refs ──
  var $ = function (id) { return document.getElementById(id); };
  var els = {};

  function cacheEls() {
    els.sidebar = $('sidebar');
    els.sidebarOverlay = $('sidebar-overlay');
    els.sidebarToggle = $('sidebar-toggle');
    els.sidebarClose = $('sidebar-close');
    els.newChat = $('new-chat-btn');
    els.doctorList = $('doctor-list');
    els.historyList = $('history-list');
    els.chatTitle = $('chat-title');
    els.messages = $('messages');
    els.empty = $('empty-state');
    els.input = $('msg-input');
    els.send = $('send-btn');
    els.imgBtn = $('img-btn');
    els.imgInput = $('img-input');
    els.imgPreview = $('img-preview');
    els.imgThumb = $('img-thumb');
    els.imgName = $('img-name');
    els.imgRemove = $('img-remove');
    els.deleteChat = $('delete-chat');
  }

  // ── LocalStorage ──
  function loadConvs() {
    try { return JSON.parse(localStorage.getItem('vc_convs')) || []; }
    catch (e) { return []; }
  }

  function saveConvs() {
    try { localStorage.setItem('vc_convs', JSON.stringify(state.conversations)); }
    catch (e) {}
  }

  // ── Doctors ──
  function renderDoctors() {
    els.doctorList.innerHTML = '';
    Object.keys(DOCTORS).forEach(function (key) {
      var doc = DOCTORS[key];
      var btn = document.createElement('button');
      btn.className = 'doctor-btn' + (key === state.selectedDoctor ? ' active' : '');
      var avatarUrl = CONFIG.avatars[key] || '';
      var avatarInner = avatarUrl
        ? '<img src="' + avatarUrl + '" alt="' + doc.name + '">'
        : '<span class="d-emoji">' + doc.emoji + '</span>';
      btn.innerHTML = '<div class="d-avatar">' + avatarInner + '</div><div class="d-info"><div class="d-name">' + doc.name + '</div><div class="d-label">' + doc.label + '</div></div>';
      btn.addEventListener('click', function () {
        state.selectedDoctor = key;
        renderDoctors();
        els.chatTitle.textContent = DOCTORS[key].name;
      });
      els.doctorList.appendChild(btn);
    });
  }

  // ── History ──
  function renderHistory() {
    els.historyList.innerHTML = '';
    if (state.conversations.length === 0) {
      els.historyList.innerHTML = '<div class="history-empty"><span>📋</span>No saved chats yet</div>';
      return;
    }
    var list = state.conversations.slice().reverse();
    list.forEach(function (conv) {
      var item = document.createElement('button');
      item.className = 'history-item';
      item.setAttribute('data-id', conv.id);
      var title = conv.title || 'Chat';
      item.innerHTML = '<span class="h-title">💬 ' + title + '</span><span class="h-del">✕</span>';
      item.addEventListener('click', function (e) {
        if (e.target.classList.contains('h-del')) {
          e.stopPropagation();
          var id = parseInt(this.getAttribute('data-id'));
          state.conversations = state.conversations.filter(function (c) { return c.id !== id; });
          saveConvs();
          renderHistory();
          return;
        }
        var id = parseInt(this.getAttribute('data-id'));
        loadConversation(id);
      });
      els.historyList.appendChild(item);
    });
  }

  function getConvTitle() {
    for (var i = 0; i < state.messages.length; i++) {
      if (state.messages[i].role === 'user') {
        var c = state.messages[i].content;
        return c.length > 50 ? c.substring(0, 50) + '...' : c;
      }
    }
    return 'Chat';
  }

  function saveCurrentConversation() {
    if (state.messages.length === 0) return;
    state.conversations.push({
      id: Date.now(),
      title: getConvTitle(),
      messages: JSON.parse(JSON.stringify(state.messages)),
      doctor: state.selectedDoctor
    });
    saveConvs();
  }

  function newChat() {
    if (state.messages.length > 0) saveCurrentConversation();
    state.messages = [];
    renderMessages();
    renderHistory();
    closeSidebar();
  }

  function loadConversation(id) {
    for (var i = 0; i < state.conversations.length; i++) {
      if (state.conversations[i].id === id) {
        if (state.messages.length > 0) {
          var exists = state.conversations.some(function (c) { return c.id === state.conversations[i].id; });
          if (!exists) saveCurrentConversation();
        }
        state.messages = JSON.parse(JSON.stringify(state.conversations[i].messages));
        state.selectedDoctor = state.conversations[i].doctor || 'female';
        saveConvs();
        renderMessages();
        renderDoctors();
        els.chatTitle.textContent = DOCTORS[state.selectedDoctor].name;
        closeSidebar();
        return;
      }
    }
  }

  function deleteAllMessages() {
    if (state.messages.length > 0) newChat();
  }

  // ── Sidebar ──
  function openSidebar() {
    if (window.innerWidth <= 768) {
      els.sidebar.classList.add('open');
      els.sidebarOverlay.classList.add('open');
    }
  }

  function closeSidebar() {
    els.sidebar.classList.remove('open');
    els.sidebarOverlay.classList.remove('open');
  }

  function toggleSidebar() {
    var isOpen = els.sidebar.classList.contains('open');
    isOpen ? closeSidebar() : openSidebar();
  }

  // ── Messages ──
  function escapeHtml(text) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    return d.innerHTML;
  }

  function scrollToBottom() {
    var wrap = document.querySelector('.messages-wrap');
    requestAnimationFrame(function () {
      wrap.scrollTop = wrap.scrollHeight;
    });
  }

  function renderMessages() {
    if (state.messages.length === 0) {
      els.empty.style.display = 'flex';
      els.messages.querySelectorAll('.msg').forEach(function (el) { el.remove(); });
      return;
    }
    els.empty.style.display = 'none';

    var existing = els.messages.querySelectorAll('.msg');
    if (existing.length === state.messages.length) return;

    els.messages.querySelectorAll('.msg').forEach(function (el) { el.remove(); });

    state.messages.forEach(function (msg) {
      var isUser = msg.role === 'user';
      var docKey = msg.doctor || state.selectedDoctor;
      var div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'assistant') + ' doc-' + docKey;

      var avatarSrc = isUser
        ? (CONFIG.avatars.user || '')
        : (CONFIG.avatars[docKey] || '');
      var avatarInner = avatarSrc
        ? '<img src="' + avatarSrc + '" alt="">'
        : (isUser ? '👤' : DOCTORS[docKey].emoji);
      var bubbleHtml = '<div class="msg-avatar">' + avatarInner + '</div><div class="msg-bubble">';
      if (msg.image) {
        bubbleHtml += '<img class="msg-image" src="' + msg.image + '" alt="Uploaded image">';
      }
      bubbleHtml += escapeHtml(msg.content) + '</div>';
      div.innerHTML = bubbleHtml;
      els.messages.appendChild(div);
    });

    scrollToBottom();
  }

  function showTyping() {
    if (els.messages.querySelector('.typing')) return;
    var docKey = state.selectedDoctor;
    var doc = DOCTORS[docKey];
    var avatarSrc = CONFIG.avatars[docKey] || '';
    var avatarInner = avatarSrc
      ? '<img src="' + avatarSrc + '" alt="">'
      : doc.emoji;
    var typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<div class="msg-avatar">' + avatarInner + '</div><div class="msg-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    els.messages.appendChild(typing);
    scrollToBottom();
  }

  function hideTyping() {
    var t = els.messages.querySelector('.typing');
    if (t) t.remove();
  }

  function showError(msg) {
    var existing = document.querySelector('.error-toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.className = 'error-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 5000);
  }

  // ── Image ──
  function compressImage(file, maxW, maxQ) {
    return new Promise(function (resolve) {
      maxW = maxW || 1024;
      maxQ = maxQ || 0.8;
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          var w = img.width, h = img.height;
          if (w > maxW) { h = h * maxW / w; w = maxW; }
          if (h > maxW) { w = w * maxW / h; h = maxW; }
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', maxQ));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleImageSelect() {
    var file = els.imgInput.files[0];
    if (!file) return;
    compressImage(file).then(function (dataUrl) {
      state.pendingImage = dataUrl;
      els.imgThumb.src = dataUrl;
      els.imgName.textContent = file.name;
      els.imgPreview.classList.add('visible');
      els.imgInput.value = '';
    });
  }

  function clearPendingImage() {
    state.pendingImage = null;
    els.imgPreview.classList.remove('visible');
    els.imgThumb.src = '';
    els.imgName.textContent = '';
    els.imgInput.value = '';
  }

  // ── API ──
  async function sendToAPI(userMsg, imageDataUrl) {
    var systemMsg = DOCTORS[state.selectedDoctor].prompt;
    var userContent;
    var model;
    if (imageDataUrl) {
      userContent = [
        { type: 'text', text: userMsg },
        { type: 'image_url', image_url: { url: imageDataUrl } }
      ];
      model = 'meta-llama/llama-4-scout-17b-16e-instruct';
    } else {
      userContent = userMsg;
      model = 'llama-3.3-70b-versatile';
    }

    var payload = {
      model: model,
      messages: [
        { role: 'system', content: systemMsg },
        { role: 'user', content: userContent }
      ]
    };

    var url, headers;
    if (CONFIG.backendUrl) {
      url = CONFIG.backendUrl + '/api/chat';
      headers = { 'Content-Type': 'application/json' };
    } else if (CONFIG.apiKey) {
      url = 'https://api.groq.com/openai/v1/chat/completions';
      headers = {
        'Authorization': 'Bearer ' + CONFIG.apiKey,
        'Content-Type': 'application/json'
      };
    } else {
      throw new Error('API key required. Add ?key=YOUR_GROQ_KEY to the URL.');
    }

    var res = await fetch(url, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      var errText = await res.text();
      throw new Error('API error (' + res.status + '): ' + errText);
    }

    var data = await res.json();
    return data.choices[0].message.content;
  }

  async function handleSend() {
    var text = els.input.value.trim();
    var hasImage = !!state.pendingImage;
    if ((!text && !hasImage) || state.isLoading) return;

    els.input.value = '';
    state.isLoading = true;
    els.send.disabled = true;

    var imgData = state.pendingImage;
    state.messages.push({ role: 'user', content: text, image: imgData });
    clearPendingImage();
    renderMessages();

    showTyping();

    try {
      var reply = await sendToAPI(text || 'Describe this image', imgData);
      hideTyping();
      state.messages.push({ role: 'assistant', content: reply, doctor: state.selectedDoctor });
      renderMessages();
    } catch (err) {
      hideTyping();
      showError(err.message);
    }

    state.isLoading = false;
    els.send.disabled = false;
    els.input.focus();
  }

  // ── Auto-resize textarea ──
  function autoResize() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 200) + 'px';
  }

  // ── Init ──
  function init(config) {
    if (config) {
      if (config.apiKey) CONFIG.apiKey = config.apiKey;
      if (config.backendUrl) CONFIG.backendUrl = config.backendUrl;
      if (config.avatars) {
        if (config.avatars.user) CONFIG.avatars.user = config.avatars.user;
        if (config.avatars.female) CONFIG.avatars.female = config.avatars.female;
        if (config.avatars.male) CONFIG.avatars.male = config.avatars.male;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setup);
    } else {
      setup();
    }
  }

  function setup() {
    cacheEls();

    state.messages = [];
    state.conversations = loadConvs();

    renderDoctors();
    renderHistory();
    renderMessages();

    els.chatTitle.textContent = DOCTORS[state.selectedDoctor].name;

    // ── Events ──
    els.sidebarToggle.addEventListener('click', toggleSidebar);
    els.sidebarClose.addEventListener('click', closeSidebar);
    els.sidebarOverlay.addEventListener('click', closeSidebar);

    els.newChat.addEventListener('click', function () {
      newChat();
      closeSidebar();
    });

    els.send.addEventListener('click', handleSend);

    els.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    els.input.addEventListener('input', autoResize);

    els.imgBtn.addEventListener('click', function () { els.imgInput.click(); });
    els.imgInput.addEventListener('change', handleImageSelect);
    els.imgRemove.addEventListener('click', clearPendingImage);

    els.deleteChat.addEventListener('click', function () {
      if (state.messages.length === 0) return;
      if (confirm('Start a new chat? Current conversation will be saved.')) {
        newChat();
      }
    });

    scrollToBottom();
  }

  // ── Public API ──
  window.VitalCareChat = {
    init: init
  };

  // ── Auto-init ──
  var params = new URLSearchParams(window.location.search);
  var apiKey = params.get('key') || '__GROQ_API_KEY__';
  VitalCareChat.init({
    apiKey: apiKey,
    avatars: {
      female: 'chat-widget/dr-sarah.png',
      male: 'chat-widget/dr-james.png',
      user: 'chat-widget/user.jpg'
    }
  });
})();
</script>
</body>
