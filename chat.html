<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealBuddy — Chat with a Doctor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #08080e;
      --surface: #0e0e18;
      --card: rgba(255,255,255,0.035);
      --card-hover: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.06);
      --primary: #E63946;
      --primary-glow: rgba(230,57,70,0.25);
      --primary-dim: rgba(230,57,70,0.10);
      --accent: #48cae4;
      --text: #f0f0f5;
      --text-secondary: #8888a4;
      --text-muted: #4a4a5e;
      --radius: 14px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; line-height: 1.2; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    input, textarea { font-family: inherit; outline: none; border: none; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    /* ── Background glow ── */
    .chat-bg {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 600px 400px at 10% 20%, rgba(230,57,70,0.06), transparent),
        radial-gradient(ellipse 500px 400px at 90% 80%, rgba(72,202,228,0.05), transparent);
    }

    .app {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      background: rgba(8,8,14,0.75);
      backdrop-filter: blur(16px) saturate(1.3);
    }

    header .left, header .right { flex: 1; display: flex; align-items: center; gap: 12px; }
    header .right { justify-content: flex-end; }

    header .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    header .logo .mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      font-size: 16px;
      color: #fff;
    }

    header .logo span { color: var(--text); }

    .h-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 20px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .h-btn:hover { background: var(--card); color: var(--text); }

    .h-btn.new-chat-btn {
      width: auto;
      height: 36px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--primary);
      border-radius: 10px;
    }

    .h-btn.new-chat-btn:hover {
      background: #c1121f;
      box-shadow: 0 0 30px rgba(230, 57, 70, 0.25);
    }

    /* ── Tubelight Doctor Select ── */
    .tn-doctor-select {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 3px;
      position: relative;
    }

    .tn-doc-glide {
      position: absolute;
      top: 3px;
      bottom: 3px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(230,57,70,0.15), rgba(72,202,228,0.08));
      border: 1px solid rgba(230,57,70,0.1);
      pointer-events: none;
      transition: left 0.35s cubic-bezier(0.22, 1, 0.36, 1), width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }

    .tn-doc-btn {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 18px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.25s;
      white-space: nowrap;
      font-family: inherit;
    }

    .tn-doc-btn:hover { color: var(--text-secondary); }
    .tn-doc-btn.active { color: var(--text); }

    .tn-doc-btn .tn-doc-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: var(--surface);
    }

    .tn-doc-btn .tn-doc-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Sun rays ── */
    .sun-rays {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sun-rays .ray {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 6%;
      height: 90%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(var(--a));
      background: linear-gradient(to top, var(--primary), transparent 70%);
      opacity: var(--o);
      border-radius: 50% 50% 0 0;
      filter: blur(12px);
    }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .messages {
      width: 100%;
      max-width: 760px;
      padding: 16px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 24px 60px;
    }

    .empty-state h2 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1.15;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text) 40%, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 400px;
    }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: msgIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; min-width: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border: 1px solid var(--card-border);
    }

    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
      word-wrap: break-word;
      position: relative;
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, rgba(230,57,70,0.12), rgba(230,57,70,0.06));
      border: 1px solid rgba(230,57,70,0.12);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 4px;
    }

    .msg.assistant.doc-female .msg-bubble {
      border-left: 2px solid var(--primary);
    }

    .msg.assistant.doc-male .msg-bubble {
      border-left: 2px solid var(--accent);
    }

    .msg-image { margin-top: 8px; border-radius: 10px; max-width: 240px; width: 100%; height: auto; display: block; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Typing ── */
    .typing {
      display: flex; gap: 12px; align-items: center; align-self: flex-start;
      animation: msgIn 0.25s ease forwards;
    }

    .typing .msg-bubble {
      display: flex; gap: 5px; padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-left: 2px solid var(--primary);
      border-bottom-left-radius: 4px;
    }

    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%,80%,100% { transform: scale(0.6); opacity: 0.25; }
      40% { transform: scale(1); opacity: 1; }
    }

    .error-toast {
      position: fixed;
      bottom: 88px; left: 50%; transform: translateX(-50%);
      background: rgba(220,38,38,0.92);
      backdrop-filter: blur(8px);
      color: #fff; padding: 14px 24px;
      border-radius: 12px; font-size: 14px;
      animation: toastIn 0.35s ease; z-index: 1000;
      max-width: 460px; text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Prompt Input (shadcn-style) ── */
    .input-area {
      padding: 8px 24px 20px;
      flex-shrink: 0;
      background: linear-gradient(0deg, var(--bg) 60%, transparent);
    }

    .prompt-wrap {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 12px 8px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .prompt-wrap:focus-within {
      border-color: rgba(230,57,70,0.2);
      box-shadow: 0 0 0 1px rgba(230,57,70,0.06);
    }

    .prompt-files {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
    }

    .prompt-files.visible { display: flex; }

    .prompt-file-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 5px 8px 5px 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .prompt-file-chip .pfc-icon { font-size: 15px; flex-shrink: 0; }
    .prompt-file-chip .pfc-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prompt-file-chip .pfc-remove {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 1px 3px; border-radius: 4px; line-height: 1; flex-shrink: 0;
    }
    .prompt-file-chip .pfc-remove:hover { color: var(--primary); background: var(--primary-dim); }

    .prompt-textarea {
      width: 100%;
      background: none;
      border: none;
      padding: 2px 0;
      font-size: 15px;
      color: var(--text);
      resize: none;
      max-height: 160px;
      line-height: 1.6;
      font-family: inherit;
    }

    .prompt-textarea::placeholder { color: var(--text-muted); }

    .prompt-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
    }

    .prompt-actions .pa-left, .prompt-actions .pa-right {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .pa-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 16px;
    }

    .pa-btn:hover { color: var(--text); background: var(--card); }

    .pa-btn.send {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
    }

    .pa-btn.send:hover {
      background: #c1121f;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .pa-btn.send:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    /* ── History drawer ── */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 199;
      display: none;
    }

    .drawer-overlay.open { display: block; }

    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--card-border);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    }

    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-header h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .drawer-close {
      background: none; border: none;
      color: var(--text-muted); font-size: 18px;
      padding: 4px; border-radius: 6px;
    }

    .drawer-close:hover { color: var(--text); background: var(--card); }



    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .drawer-empty {
      text-align: center; padding: 40px 16px;
      color: var(--text-muted); font-size: 13px;
    }

    .drawer-empty span { font-size: 28px; display: block; margin-bottom: 8px; }

    .drawer-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
      font-size: 13px; color: var(--text-secondary);
      width: 100%; background: none; border: none;
      text-align: left; font-family: inherit;
    }

    .drawer-item:hover { background: var(--card); color: var(--text); }
    .drawer-item .di-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-item .di-del { background: none; border: none; color: var(--text-muted); font-size: 14px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; cursor: pointer; line-height: 1; }
    .drawer-item .di-del:hover { color: var(--primary); background: var(--primary-dim); }

    @media (max-width: 768px) {
      .messages { padding: 12px 16px 8px; gap: 14px; }
      .input-area { padding: 6px 12px 16px; }
      .prompt-wrap { padding: 10px 10px 6px; border-radius: 14px; }
      .msg { max-width: 95%; }
      .msg-bubble { font-size: 14px; padding: 12px 16px; }
      .empty-state h2 { font-size: 28px; }
      header { padding: 0 16px; height: 56px; }
      header .logo { font-size: 17px; }
      header .logo .mark { width: 28px; height: 28px; font-size: 14px; }
      .h-btn { width: 36px; height: 36px; font-size: 18px; }
      .h-btn.new-chat-btn { height: 32px; padding: 0 14px; font-size: 13px; }
      .tn-doc-btn { padding: 4px 14px; font-size: 12px; }
      .tn-doc-btn .tn-doc-avatar { width: 22px; height: 22px; }
    }

    @media (max-width: 480px) {
      .tn-doc-btn span:not(.tn-doc-avatar) { display: none; }
      .tn-doc-btn { padding: 5px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg, .typing, .error-toast { animation: none; }
      .typing-dot { animation: none; opacity: 0.5; }
      .sun-rays { display: none; }
    }
  </style>
</head>
<body>

<div class="chat-bg"></div>
<div class="app">
  <header>
    <div class="left">
      <button class="h-btn" id="history-toggle" title="Chat history">☰</button>
      <div class="logo" id="logo-btn"><span class="mark">+</span><span>HealBuddy</span></div>
    </div>
    <div class="tn-doctor-select" id="tn-doctor-select">
      <div class="tn-doc-glide" id="tn-doc-glide"></div>
      <button class="tn-doc-btn active" data-doc="elena" id="tn-doc-elena" title="Dr. Elena">
        <span class="tn-doc-avatar" id="tn-doc-avatar-elena"></span>
        <span>Elena</span>
      </button>
      <button class="tn-doc-btn" data-doc="james" id="tn-doc-james" title="Dr. James">
        <span class="tn-doc-avatar" id="tn-doc-avatar-james"></span>
        <span>James</span>
      </button>
    </div>
    <div class="right">
      <button class="h-btn new-chat-btn" id="new-chat-btn">New Chat</button>
    </div>
  </header>

  <div class="messages-wrap">
    <div class="sun-rays">
      <div class="ray" style="--a:-35deg;--o:0.04"></div>
      <div class="ray" style="--a:-25deg;--o:0.07"></div>
      <div class="ray" style="--a:-15deg;--o:0.10"></div>
      <div class="ray" style="--a:-5deg;--o:0.12"></div>
      <div class="ray" style="--a:5deg;--o:0.12"></div>
      <div class="ray" style="--a:15deg;--o:0.10"></div>
      <div class="ray" style="--a:25deg;--o:0.07"></div>
      <div class="ray" style="--a:35deg;--o:0.04"></div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <h2>What's on your mind?</h2>
        <p>Share your symptoms and get medical guidance from our AI doctors.</p>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="prompt-wrap" id="prompt-wrap">
      <div class="prompt-files" id="prompt-files"></div>
      <textarea class="prompt-textarea" id="msg-input" rows="1" placeholder="Describe your symptoms..." autocomplete="off"></textarea>
      <div class="prompt-actions">
        <div class="pa-left">
          <button class="pa-btn" id="img-btn" title="Attach file">📎</button>
        </div>
        <div class="pa-right">
          <button class="pa-btn send" id="send-btn" title="Send message">↑</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="img-input" accept="image/*" hidden>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <h3>History</h3>
      <button class="drawer-close" id="drawer-close">✕</button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    apiKey: '',
    backendUrl: '',
    avatars: {}
  };

  var DOCTORS = {
    female: {
      name: 'Dr. Elena',
      label: 'Caring & Warm',
      emoji: '\uD83D\uDC69\u200D\u2695\uFE0F',
      key: 'female',
      prompt: 'You are Dr. Elena, a warm and caring doctor. Speak with kindness, empathy, and a gentle bedside manner \u2014 like a trusted family physician who truly listens. If the user asks something off-topic (not health-related), gently steer them back with warmth. For example: "That\'s an interesting question! While I\'m here to help with health topics, is there something about your wellbeing I can assist with? \uD83D\uDE0A" Keep responses helpful and informative.'
    },
    male: {
      name: 'Dr. James',
      label: 'Professional & Direct',
      emoji: '\uD83D\uDC68\u200D\u2695\uFE0F',
      key: 'male',
      prompt: 'You are Dr. James, a cold and strictly professional doctor. Be direct, concise, and clinical. No pleasantries, no warmth \u2014 just precise medical answers. If the user asks something off-topic, state flatly: "That is outside my scope. Please ask a health-related question." Keep responses direct and informative.'
    }
  };

  var state = {
    selectedDoctor: 'female',
    messages: [],
    isLoading: false,
    conversations: [],
    pendingImage: null,
    pendingFiles: []
  };

  var $ = function (id) { return document.getElementById(id); };
  var els = {};

  function cacheEls() {
    els.messages = $('messages');
    els.empty = $('empty-state');
    els.input = $('msg-input');
    els.send = $('send-btn');
    els.imgBtn = $('img-btn');
    els.imgInput = $('img-input');
    els.promptFiles = $('prompt-files');
    els.newChat = $('new-chat-btn');
    els.historyToggle = $('history-toggle');
    els.tnDocGlide = $('tn-doc-glide');
    els.tnDocBtns = document.querySelectorAll('.tn-doc-btn');
    els.tnDocElena = $('tn-doc-elena');
    els.tnDocJames = $('tn-doc-james');
    els.tnDocAvatarElena = $('tn-doc-avatar-elena');
    els.tnDocAvatarJames = $('tn-doc-avatar-james');
    els.drawer = $('drawer');
    els.drawerOverlay = $('drawer-overlay');
    els.drawerClose = $('drawer-close');
    els.drawerList = $('drawer-list');
  }

  function loadConvs() {
    try { return JSON.parse(localStorage.getItem('vc_convs')) || []; }
    catch (e) { return []; }
  }

  function saveConvs() {
    try { localStorage.setItem('vc_convs', JSON.stringify(state.conversations)); }
    catch (e) {}
  }

  // ── Doctor selector + Tubelight ──
  function renderDocSelector() {
    Object.keys(DOCTORS).forEach(function (key) {
      var doc = DOCTORS[key];
      var avatarEl = key === 'female' ? els.tnDocAvatarElena : els.tnDocAvatarJames;
      var avatarSrc = CONFIG.avatars[key] || '';
      avatarEl.innerHTML = avatarSrc
        ? '<img src="' + avatarSrc + '" alt="">'
        : doc.emoji;
    });
  }

  function selectDoctor(key) {
    state.selectedDoctor = key;
    var docKey = key === 'female' ? 'elena' : 'james';
    els.tnDocBtns.forEach(function (item) {
      item.classList.toggle('active', item.dataset.doc === docKey);
    });
    positionDocGlide(docKey);
  }

  function positionDocGlide(docKey) {
    var activeEl = document.querySelector('.tn-doc-btn[data-doc="' + docKey + '"]');
    if (!activeEl || !els.tnDocGlide) return;
    var parent = document.getElementById('tn-doctor-select');
    var pRect = parent.getBoundingClientRect();
    var aRect = activeEl.getBoundingClientRect();
    els.tnDocGlide.style.left = (aRect.left - pRect.left) + 'px';
    els.tnDocGlide.style.width = aRect.width + 'px';
  }

  // ── History ──
  function renderHistory() {
    els.drawerList.innerHTML = '';
    if (state.conversations.length === 0) {
      els.drawerList.innerHTML = '<div class="drawer-empty"><span>📋</span>No saved chats yet</div>';
      return;
    }
    state.conversations.slice().reverse().forEach(function (conv) {
      var item = document.createElement('button');
      item.className = 'drawer-item';
      item.setAttribute('data-id', conv.id);
      var title = conv.title || 'Chat';
      item.innerHTML = '<span class="di-title">💬 ' + title + '</span><span class="di-del">✕</span>';
      item.addEventListener('click', function (e) {
        if (e.target.classList.contains('di-del')) {
          e.stopPropagation();
          state.conversations = state.conversations.filter(function (c) { return c.id !== conv.id; });
          saveConvs();
          renderHistory();
          return;
        }
        loadConversation(conv.id);
      });
      els.drawerList.appendChild(item);
    });
  }

  function getConvTitle() {
    for (var i = 0; i < state.messages.length; i++) {
      if (state.messages[i].role === 'user') {
        var c = state.messages[i].content;
        return c.length > 50 ? c.substring(0, 50) + '...' : c;
      }
    }
    return 'Chat';
  }

  function saveCurrentConv() {
    if (state.messages.length === 0) return;
    state.conversations.push({
      id: Date.now(),
      title: getConvTitle(),
      messages: JSON.parse(JSON.stringify(state.messages)),
      doctor: state.selectedDoctor
    });
    saveConvs();
  }

  function newChat() {
    if (state.messages.length > 0) saveCurrentConv();
    state.messages = [];
    renderMessages();
    renderHistory();
    closeDrawer();
  }

  function loadConversation(id) {
    for (var i = 0; i < state.conversations.length; i++) {
      if (state.conversations[i].id === id) {
        if (state.messages.length > 0) saveCurrentConv();
        state.messages = JSON.parse(JSON.stringify(state.conversations[i].messages));
        state.selectedDoctor = state.conversations[i].doctor || 'female';
        saveConvs();
        selectDoctor(state.selectedDoctor);
        renderMessages();
        renderHistory();
        closeDrawer();
        return;
      }
    }
  }

  // ── Drawer ──
  function openDrawer() { els.drawer.classList.add('open'); els.drawerOverlay.classList.add('open'); renderHistory(); }
  function closeDrawer() { els.drawer.classList.remove('open'); els.drawerOverlay.classList.remove('open'); }

  // ── Messages ──
  function escapeHtml(text) { var d = document.createElement('div'); d.appendChild(document.createTextNode(text)); return d.innerHTML; }

  function scrollToBottom() {
    var wrap = els.messages.parentElement;
    requestAnimationFrame(function () { wrap.scrollTop = wrap.scrollHeight; });
  }

  function renderMessages() {
    if (state.messages.length === 0) {
      els.empty.style.display = 'flex';
      els.messages.querySelectorAll('.msg').forEach(function (el) { el.remove(); });
      return;
    }
    els.empty.style.display = 'none';
    var existing = els.messages.querySelectorAll('.msg');
    if (existing.length === state.messages.length) return;
    els.messages.querySelectorAll('.msg').forEach(function (el) { el.remove(); });

    state.messages.forEach(function (msg) {
      var isUser = msg.role === 'user';
      var docKey = msg.doctor || state.selectedDoctor;
      var div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'assistant') + ' doc-' + docKey;
      var avatarSrc = isUser ? (CONFIG.avatars.user || '') : (CONFIG.avatars[docKey] || '');
      var avatarInner = avatarSrc ? '<img src="' + avatarSrc + '" alt="">' : (isUser ? '👤' : DOCTORS[docKey].emoji);
      var html = '<div class="msg-avatar">' + avatarInner + '</div><div class="msg-bubble">';
      if (msg.image) html += '<img class="msg-image" src="' + msg.image + '" alt="Uploaded image">';
      html += escapeHtml(msg.content) + '</div>';
      div.innerHTML = html;
      els.messages.appendChild(div);
    });
    scrollToBottom();
  }

  function showTyping() {
    if (els.messages.querySelector('.typing')) return;
    var docKey = state.selectedDoctor;
    var doc = DOCTORS[docKey];
    var avatarSrc = CONFIG.avatars[docKey] || '';
    var avatarInner = avatarSrc ? '<img src="' + avatarSrc + '" alt="">' : doc.emoji;
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<div class="msg-avatar">' + avatarInner + '</div><div class="msg-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    els.messages.appendChild(t);
    scrollToBottom();
  }

  function hideTyping() { var t = els.messages.querySelector('.typing'); if (t) t.remove(); }

  function showError(msg) {
    var existing = document.querySelector('.error-toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.className = 'error-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 5000);
  }

  // ── Image / Files ──
  function compressImage(file, maxW, maxQ) {
    return new Promise(function (resolve) {
      maxW = maxW || 1024; maxQ = maxQ || 0.8;
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          var w = img.width, h = img.height;
          if (w > maxW) { h = h * maxW / w; w = maxW; }
          if (h > maxW) { w = w * maxW / h; h = maxW; }
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', maxQ));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderFileChips() {
    var container = els.promptFiles;
    container.innerHTML = '';
    if (!state.pendingFiles || state.pendingFiles.length === 0) {
      container.classList.remove('visible');
      return;
    }
    container.classList.add('visible');
    state.pendingFiles.forEach(function (f, i) {
      var chip = document.createElement('div');
      chip.className = 'prompt-file-chip';
      chip.innerHTML =
        '<span class="pfc-icon">📷</span>' +
        '<span class="pfc-name">' + f.name + '</span>' +
        '<button class="pfc-remove" data-idx="' + i + '">✕</button>';
      chip.querySelector('.pfc-remove').addEventListener('click', function () {
        state.pendingFiles.splice(i, 1);
        if (state.pendingFiles.length === 0) state.pendingImage = null;
        renderFileChips();
      });
      container.appendChild(chip);
    });
  }

  function handleImageSelect() {
    var file = els.imgInput.files[0];
    if (!file) return;
    if (!state.pendingFiles) state.pendingFiles = [];
    compressImage(file).then(function (dataUrl) {
      state.pendingImage = dataUrl;
      state.pendingFiles.push({ name: file.name, dataUrl: dataUrl });
      renderFileChips();
      els.imgInput.value = '';
    });
  }

  function clearPendingImage() {
    state.pendingImage = null;
    state.pendingFiles = [];
    renderFileChips();
    els.imgInput.value = '';
  }

  // ── API ──
  async function sendToAPI(userMsg, imageDataUrl) {
    var key = CONFIG.apiKey;
    if (!key || key.indexOf('gsk_') !== 0) {
      throw new Error(
        !key
          ? 'API key is missing. Add ?key=YOUR_GROQ_KEY to the URL.'
          : 'Invalid API key format. Make sure to add ?key=YOUR_GROQ_KEY to the URL.'
      );
    }
    var systemMsg = DOCTORS[state.selectedDoctor].prompt;
    var userContent, model;
    if (imageDataUrl) {
      userContent = [
        { type: 'text', text: userMsg },
        { type: 'image_url', image_url: { url: imageDataUrl } }
      ];
      model = 'meta-llama/llama-4-scout-17b-16e-instruct';
    } else {
      userContent = userMsg;
      model = 'llama-3.3-70b-versatile';
    }
    var payload = {
      model: model,
      messages: [
        { role: 'system', content: systemMsg },
        { role: 'user', content: userContent }
      ]
    };
    var url, headers;
    if (CONFIG.backendUrl) {
      url = CONFIG.backendUrl + '/api/chat';
      headers = { 'Content-Type': 'application/json' };
    } else {
      url = 'https://api.groq.com/openai/v1/chat/completions';
      headers = { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' };
    }
    try {
      var res = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
      if (!res.ok) {
        var errText = await res.text().catch(function () { return ''; });
        if (res.status === 401) throw new Error('Invalid API key. Check your Groq key and try again.');
        if (res.status === 429) throw new Error('Rate limit exceeded. Please wait a moment and try again.');
        throw new Error('Server error (' + res.status + '). Please try again.');
      }
      var data = await res.json();
      return data.choices[0].message.content;
    } catch (err) {
      if (err.name === 'TypeError' && err.message.indexOf('fetch') >= 0) {
        throw new Error('Network error — this page must be served over HTTPS (use GitHub Pages or a local server like "python -m http.server 8000").');
      }
      throw err;
    }
  }

  function updateSendBtn() {
    els.send.textContent = state.isLoading ? '■' : '↑';
    els.send.disabled = state.isLoading && !state.pendingCancel;
  }

  async function handleSend() {
    var text = els.input.value.trim();
    var hasImage = !!state.pendingImage;
    if ((!text && !hasImage) || state.isLoading) return;
    if (state.isLoading) {
      state.pendingCancel = true;
      return;
    }
    els.input.value = '';
    state.isLoading = true;
    state.pendingCancel = false;
    updateSendBtn();
    var imgData = state.pendingImage;
    state.messages.push({ role: 'user', content: text, image: imgData });
    clearPendingImage();
    renderMessages();
    showTyping();
    try {
      var reply = await sendToAPI(text || 'Describe this image', imgData);
      hideTyping();
      state.messages.push({ role: 'assistant', content: reply, doctor: state.selectedDoctor });
      renderMessages();
    } catch (err) {
      hideTyping();
      showError(err.message);
    }
    state.isLoading = false;
    updateSendBtn();
    els.input.focus();
  }

  function autoResize() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 200) + 'px';
  }

  // ── Init ──
  function init(config) {
    if (config) {
      if (config.apiKey) CONFIG.apiKey = config.apiKey;
      if (config.backendUrl) CONFIG.backendUrl = config.backendUrl;
      if (config.avatars) {
        if (config.avatars.user) CONFIG.avatars.user = config.avatars.user;
        if (config.avatars.female) CONFIG.avatars.female = config.avatars.female;
        if (config.avatars.male) CONFIG.avatars.male = config.avatars.male;
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setup);
    } else { setup(); }
  }

  function setup() {
    cacheEls();
    state.messages = [];
    state.conversations = loadConvs();
    renderDocSelector();
    renderHistory();
    renderMessages();

    els.send.addEventListener('click', handleSend);
    els.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    els.input.addEventListener('input', autoResize);

    els.imgBtn.addEventListener('click', function () { els.imgInput.click(); });
    els.imgInput.addEventListener('change', handleImageSelect);

    els.logo = $('logo-btn');
    els.logo.addEventListener('click', function () { window.location.href = 'index.html'; });

    // ── Header events ──
    els.tnDocElena.addEventListener('click', function () { selectDoctor('female'); });
    els.tnDocJames.addEventListener('click', function () { selectDoctor('male'); });
    els.historyToggle.addEventListener('click', openDrawer);
    els.newChat.addEventListener('click', function () {
      if (state.messages.length > 0) { saveCurrentConv(); newChat(); } else newChat();
    });

    // ── Tubelight init ──
    selectDoctor(state.selectedDoctor);
    setTimeout(function () {
      var docKey = state.selectedDoctor === 'female' ? 'elena' : 'james';
      positionDocGlide(docKey);
    }, 50);

    els.drawerClose.addEventListener('click', closeDrawer);
    els.drawerOverlay.addEventListener('click', closeDrawer);

    // ── Reposition glide on resize ──
    window.addEventListener('resize', function () {
      var docKey = state.selectedDoctor === 'female' ? 'elena' : 'james';
      positionDocGlide(docKey);
    });

    scrollToBottom();
  }

  window.HealBuddyChat = { init: init };

  // ── Auto-init ──
  var params = new URLSearchParams(window.location.search);
  var apiKey = params.get('key') || '__GROQ_API_KEY__';
  init({
    apiKey: apiKey,
    avatars: {
      female: 'assets/dr-sarah.png',
      male: 'assets/dr-james.png',
      user: 'assets/user.jpg'
    }
  });

  // ── Handle URL params ──
  var docParam = params.get('doc');
  if (docParam && DOCTORS[docParam]) {
    setTimeout(function () { selectDoctor(docParam); }, 100);
  }
  var msgParam = params.get('msg');
  if (msgParam) {
    setTimeout(function () {
      els.input.value = decodeURIComponent(msgParam);
      els.input.focus();
      autoResize();
    }, 200);
  }
})();
</script>
